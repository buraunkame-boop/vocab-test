<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#1f3a6e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英単語テスト">
<title>英単語テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap&text=0123456789%2F%25%E2%97%8B%C3%97%E6%AD%A3%E8%A7%A3%E7%82%B9%E6%8E%A1%E6%B8%88%E5%90%88%E6%A0%BC" rel="stylesheet">
<style>
  :root {
    --desk: #e9e6df;
    --paper: #fffdf8;
    --ink: #1f1d1a;
    --ink-soft: #625b50;
    --rule: #d6cfc1;
    --line: #2a2723;
    --pencil: #3b3b3b;
    --red: #d42f28;
    --red-bg: #fff1ef;
    --navy: #1f3a6e;
    --navy-bg: #edf1f8;
    /* 進み具合の色: 合格 / あと1回で合格 / ×印 / まだ / タイルの塗り */
    --c-a: #f1aea7;
    --c-m: #93a5c8;
    --c-n: #e3ddd1;
    --c-fill: #fbd5d0;
    --mincho: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
    --gothic: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
    --latin: "Century Schoolbook", "Century", "New Century Schoolbook", "TeX Gyre Schola", Georgia, "Times New Roman", serif;
    --hand: "Klee One", var(--mincho);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--desk);
    color: var(--ink);
    font-family: var(--gothic);
    line-height: 1.6;
    -webkit-tap-highlight-color: transparent;
  }
  main { padding: max(14px, env(safe-area-inset-top)) 12px max(28px, env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; cursor: pointer; }
  input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
  .muted { color: var(--ink-soft); }
  .small { font-size: 13px; }

  /* ---- 用紙（ホーム・結果・単語帳） ---- */
  .sheet {
    position: relative;
    max-width: 680px;
    margin: 0 auto;
    background: var(--paper);
    border-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 8px 24px rgba(60,50,30,.10);
    padding: 24px 18px 28px;
  }
  @media (min-width: 560px) { .sheet { padding: 38px 44px 42px; } main { padding-top: 28px; } }
  .head { position: relative; border-bottom: 2px solid var(--line); padding-bottom: 14px; margin-bottom: 18px; }
  .kicker { font-size: 12px; letter-spacing: .2em; color: var(--ink-soft); margin: 0 0 2px; }
  .title { font-family: var(--mincho); font-size: 23px; font-weight: 700; line-height: 1.35; margin: 0 0 4px; letter-spacing: .02em; }
  .range { font-size: 14px; color: var(--ink-soft); margin: 0; }
  .section-title { font-size: 14px; font-weight: 700; letter-spacing: .15em; border-left: 4px solid var(--line); padding-left: 8px; margin: 28px 0 12px; }
  .hint { color: var(--red); font-size: 13px; margin: 6px 0 0; min-height: 1em; }

  .form-row { margin: 0 0 16px; }
  .form-row > .label { display: block; font-weight: 600; font-size: 13px; letter-spacing: .1em; margin-bottom: 6px; }
  .field {
    width: 100%; font-family: var(--mincho); font-size: 18px; color: var(--ink);
    background: transparent; border: 0; border-bottom: 1.5px solid var(--line); padding: 8px 2px;
  }
  .range-row { display: flex; align-items: center; gap: 10px; }
  .range-row .field { text-align: center; }
  .picker { display: grid; gap: 8px; }
  .option { display: flex; gap: 12px; align-items: center; border: 1.5px solid var(--rule); border-radius: 6px; padding: 11px 12px; cursor: pointer; }
  .option:has(input:checked) { border-color: var(--line); background: #f4f0e6; }
  .option input { width: 18px; height: 18px; accent-color: var(--navy); flex: 0 0 auto; }
  .option small { color: var(--ink-soft); font-size: 12px; display: block; }

  .btn {
    background: var(--navy); color: #fff; border: 0; border-radius: 999px;
    font-weight: 700; font-size: 16px; letter-spacing: .08em;
    min-height: 50px; padding: 0 24px;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none; text-align: center;
  }
  .btn.ghost { background: transparent; color: var(--navy); border: 1.5px solid var(--navy); }
  .btn.red { background: var(--red); }
  .btn.wide { width: 100%; }
  .stack { display: grid; gap: 10px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .actions > * { flex: 1 1 140px; }
  .linkish { background: none; border: 0; padding: 0; margin-left: 6px; color: var(--navy); text-decoration: underline; font-size: 13px; }
  .back { display: inline-block; font-size: 13px; color: var(--navy); margin: 0 0 10px; text-decoration: none; }

  .resume { display: flex; gap: 12px; align-items: center; justify-content: space-between; background: #f4f0e6; border: 1.5px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 0 0 18px; font-size: 13px; }
  .resume .btn { min-height: 40px; padding: 0 16px; font-size: 14px; flex: 0 0 auto; }
  ul.marklist { list-style: none; padding: 0; margin: 12px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; }
  .marklist li { display: flex; align-items: baseline; gap: 6px; border-bottom: 1px dashed var(--rule); padding: 4px 0; min-width: 0; }
  .marklist .x { color: var(--navy); font-weight: 700; }
  .marklist .en { font-family: var(--latin); font-weight: 700; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .dots { color: var(--red); font-size: 11px; letter-spacing: .1em; white-space: nowrap; }

  /* ---- 進み具合（合格した単語の割合） ---- */
  .option > .opt-body { flex: 1; min-width: 0; }
  .sbar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--c-n); }
  .sbar > i { display: block; height: 100%; flex: 0 0 auto; }
  .sbar .p, .sw.p { background: var(--red); }
  .sbar .g { background: repeating-linear-gradient(-45deg, var(--red) 0 5px, #e86a62 5px 10px); animation: grow .9s .25s ease-out both; }
  .sbar .a, .sw.a { background: var(--c-a); }
  .sbar .m, .sw.m { background: var(--c-m); }
  .sw.n { background: var(--c-n); }
  .sbar.mini { height: 5px; margin-top: 6px; }
  .sbar.big { height: 14px; }
  @keyframes grow { from { width: 0; } }

  .prog { display: flex; align-items: center; gap: 18px; }
  .ring { flex: 0 0 auto; width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; }
  .ring-in { width: 84px; height: 84px; border-radius: 50%; background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
  .ring-in strong { font-family: var(--hand); font-weight: 600; font-size: 34px; color: var(--red); }
  .ring-in strong span { font-size: 16px; margin-left: 1px; }
  .ring-in small { font-size: 11px; color: var(--ink-soft); margin-top: 5px; letter-spacing: .1em; }
  .legend { list-style: none; margin: 0; padding: 0; flex: 1; min-width: 0; font-size: 13px; display: grid; gap: 4px; }
  .legend li { display: flex; align-items: center; gap: 8px; }
  .legend .sw { width: 11px; height: 11px; border-radius: 3px; flex: 0 0 auto; }
  .legend .v { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
  .legend .v small { font-weight: 400; color: var(--ink-soft); font-size: 11px; margin-left: 1px; }
  .prog-note { font-size: 12px; color: var(--ink-soft); margin: 10px 0 0; }

  .blocks { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; margin: 0 0 14px; }
  .blk {
    --f: 0%;
    min-height: 54px; padding: 6px 2px 5px; border-radius: 8px; border: 1.5px solid var(--rule);
    background: linear-gradient(to top, var(--c-fill) var(--f), var(--paper) var(--f));
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; line-height: 1.1;
  }
  .blk .r { font-family: var(--latin); font-size: 11px; color: var(--ink-soft); white-space: nowrap; }
  .blk b { font-family: var(--hand); font-weight: 600; font-size: 17px; }
  .blk.full { border-color: var(--red); }
  .blk.full b { color: var(--red); }
  .blk[aria-pressed="true"] { border-color: var(--navy); box-shadow: inset 0 0 0 1.5px var(--navy); }
  .blk[aria-pressed="true"] .r { color: var(--navy); font-weight: 700; }
  .range-row .by { flex: 0 0 auto; font-size: 12px; color: var(--ink-soft); }
  .range-stat { margin: 12px 0 0; }
  .range-stat p { margin: 6px 0 0; font-size: 13px; color: var(--ink-soft); }
  .range-stat b { color: var(--ink); }

  .gain-box { margin: 20px 0 0; padding: 14px 14px 12px; border: 1.5px solid var(--rule); border-radius: 10px; }
  .gain-label { margin: 0 0 8px; font-size: 13px; font-weight: 700; letter-spacing: .05em; }
  .gain-num { margin: 8px 0 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .gain-num strong { font-family: var(--hand); font-weight: 600; font-size: 30px; color: var(--red); line-height: 1; }
  .gain-num .was { font-family: var(--hand); font-weight: 600; font-size: 18px; color: var(--ink-soft); }
  .gain-num .arrow { color: var(--ink-soft); }
  .gain-num em { font-style: normal; font-size: 13px; font-weight: 700; color: var(--red); margin-left: auto; }
  .gain-sub { margin: 4px 0 0; font-size: 12px; color: var(--ink-soft); }
  .gain-sub.all { color: var(--red); font-weight: 700; font-size: 14px; }

  /* ---- 4択（1問ずつ） ---- */
  .quiz { max-width: 560px; margin: 0 auto; }
  .qbar { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; min-height: 40px; }
  .qbar .quit { background: none; border: 0; color: var(--ink-soft); font-weight: 600; padding: 8px 6px; margin-left: -6px; }
  .qbar .count { flex: 1; text-align: center; letter-spacing: .05em; }
  .qbar .streak { min-width: 4.5em; text-align: right; color: var(--red); font-size: 12px; letter-spacing: .12em; }
  .track { height: 6px; background: #d9d3c7; border-radius: 99px; overflow: hidden; margin: 2px 0 14px; }
  .track > div { height: 100%; background: var(--navy); border-radius: 99px; transition: width .25s ease; }

  .qcard {
    position: relative; overflow: hidden;
    background: var(--paper); border-radius: 14px;
    box-shadow: 0 1px 2px rgba(0,0,0,.07), 0 6px 18px rgba(60,50,30,.08);
    padding: 22px 16px 20px; text-align: center; min-height: 168px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .qcard .qno { font-size: 12px; color: var(--ink-soft); letter-spacing: .12em; }
  .qcard .tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--navy); border: 1.5px solid var(--navy); border-radius: 999px; padding: 0 8px; margin-left: 6px; letter-spacing: .05em; }
  .qcard .word {
    font-family: var(--latin); font-weight: 700; color: var(--ink);
    font-size: clamp(34px, 11vw, 50px); line-height: 1.15; margin: 8px 0 10px; overflow-wrap: anywhere;
    background: none; border: 0; padding: 0;
  }
  .say-btn {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--navy);
    background: var(--navy-bg); border: 0; border-radius: 999px; padding: 5px 12px;
  }
  .say-btn svg { width: 15px; height: 15px; fill: currentColor; }
  /* 多義語（東京医科大 第1問の形式）: 英文の下線部 → 英語の4択 */
  .qcard .inst { font-size: 12px; color: var(--ink-soft); margin: 8px 0 4px; text-align: left; align-self: stretch; line-height: 1.5; }
  .qcard .sent { font-family: var(--latin); font-size: clamp(19px, 5.4vw, 23px); line-height: 1.55; color: var(--ink); margin: 6px 0 12px; text-align: left; align-self: stretch; overflow-wrap: anywhere; }
  .qcard .sent u { text-decoration-thickness: 2px; text-underline-offset: 4px; font-weight: 700; }
  .choice.en .t { font-family: var(--latin); font-size: 18px; }
  .feedback .kaisetsu { margin: 8px 0 0; font-size: 15px; }
  .feedback .src { margin: 6px 0 0; font-size: 12px; color: var(--red); font-weight: 700; }
  .qcard.is-choice .judge::before { opacity: .25 !important; }
  .list-note { margin: 8px 0 0; font-size: 13px; color: var(--navy); font-weight: 600; }

  .judge { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; font-family: var(--hand); font-weight: 600; line-height: 1; }
  .judge.ok::before { content: "○"; font-size: 190px; color: var(--red); opacity: .8; animation: pop .3s ease-out both; }
  .judge.ng::before { content: "×"; font-size: 180px; color: var(--navy); opacity: .72; animation: pop .3s ease-out both; }
  .pass-stamp {
    position: absolute; right: 12px; top: 12px; width: 84px; height: 84px; border-radius: 50%;
    border: 3px solid var(--red); color: var(--red); display: grid; place-items: center;
    font-family: var(--hand); font-weight: 600; font-size: 24px; background: rgba(255, 253, 248, .85);
    box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 4.5px var(--red);
    animation: stamp .45s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); } }
  @keyframes stamp { from { transform: rotate(-14deg) scale(1.8); opacity: 0; } to { transform: rotate(-14deg) scale(1); opacity: 1; } }

  .choices { display: grid; gap: 10px; margin-top: 14px; }
  .choice {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px;
    padding: 10px 14px; text-align: left; font-size: 17px; line-height: 1.4; color: var(--ink);
    background: var(--paper); border: 2px solid var(--rule); border-radius: 12px;
    transition: background .12s, border-color .12s, opacity .12s, transform .06s;
  }
  .choice:active { transform: scale(.985); }
  .choice .n {
    flex: 0 0 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    background: #efeae0; color: var(--ink-soft); font-weight: 700; font-size: 15px;
  }
  .choice .t { flex: 1; min-width: 0; }
  .choice.correct { border-color: var(--red); background: var(--red-bg); font-weight: 700; }
  .choice.correct .n { background: var(--red); color: #fff; }
  .choice.wrong { border-color: var(--navy); background: var(--navy-bg); }
  .choice.wrong .n { background: var(--navy); color: #fff; }
  .choice.dim { opacity: .4; }
  .answered .choice { pointer-events: none; }

  .feedback { margin-top: 12px; background: var(--paper); border-radius: 12px; padding: 12px 14px; font-size: 14px; border-left: 4px solid var(--navy); }
  .feedback.pass { border-left-color: var(--red); }
  .feedback .head-line { font-weight: 700; margin: 0 0 4px; }
  .feedback .ans { color: var(--red); font-weight: 700; }
  .feedback .ex-en { font-family: var(--latin); font-size: 15px; margin: 8px 0 0; }
  .feedback .ex-en mark { background: none; color: inherit; font-weight: 700; text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .feedback .ex-ja { color: var(--ink-soft); font-size: 13px; margin: 2px 0 0; }
  .next-row { margin-top: 12px; }

  /* ---- 結果 ---- */
  .score-big { text-align: center; margin: 6px 0 4px; }
  .score-big strong { font-family: var(--hand); font-weight: 600; font-size: 72px; color: var(--red); line-height: 1; }
  .score-big span { font-family: var(--hand); font-weight: 600; font-size: 26px; color: var(--red); margin-left: 4px; }
  .score-meta { text-align: center; color: var(--ink-soft); font-size: 13px; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0 0; }
  .pass-chip, .x-chip { font-size: 13px; font-weight: 700; padding: 3px 12px; border-radius: 999px; }
  .pass-chip { color: #fff; background: var(--red); }
  .x-chip { color: var(--navy); border: 1.5px solid var(--navy); }
  ul.wordlist { list-style: none; margin: 0; padding: 0; }
  .wordlist li { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px dashed var(--rule); }
  .wordlist .mk { flex: 0 0 auto; font-weight: 700; }
  .wordlist .mk.x { color: var(--navy); }
  .wordlist .mk.p { color: var(--red); font-family: var(--hand); }
  .wordlist .en { font-family: var(--latin); font-weight: 700; flex: 0 0 auto; }
  .wordlist .ja { color: var(--ink-soft); font-size: 14px; }

  /* ---- 確認ダイアログ ---- */
  .modal { position: fixed; inset: 0; z-index: 10; background: rgba(30, 25, 15, .45); display: grid; place-items: center; padding: 16px; }
  .modal-card { background: var(--paper); max-width: 380px; width: 100%; border-radius: 10px; padding: 22px 20px 18px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .modal-card p { margin: 0 0 18px; font-size: 16px; }
  .modal-card .row { display: flex; gap: 10px; }
  .modal-card .row > * { flex: 1; padding: 0 10px; }

  /* ---- 単語帳 ---- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 0; font-family: var(--gothic); }
  .search {
    flex: 1 1 170px; min-width: 0; font-family: var(--gothic); font-size: 16px; color: var(--ink);
    background: #fff; border: 1.5px solid var(--rule); border-radius: 999px; padding: 9px 14px;
  }
  .chip {
    font-family: var(--gothic); font-size: 13px; font-weight: 600; color: var(--ink-soft);
    background: transparent; border: 1.5px solid var(--rule); border-radius: 999px; padding: 0 12px; min-height: 38px;
  }
  .chip[aria-pressed="true"] { border-color: var(--navy); color: var(--navy); background: rgba(31,58,110,.08); }
  .book-hint { font-family: var(--gothic); font-size: 12px; color: var(--ink-soft); margin: 10px 0 0; }
  ol.book { list-style: none; margin: 0; padding: 0; }
  .entry { border-bottom: 1px solid var(--rule); padding: 14px 0 12px; }
  .entry:last-child { border-bottom: 0; }
  .e-head { display: flex; align-items: center; gap: 10px; }
  .e-no { font-family: var(--gothic); font-size: 13px; color: var(--ink-soft); min-width: 2.4em; }
  .e-word {
    flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left;
    font-family: var(--latin); font-size: 24px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; color: var(--ink);
  }
  .e-pos { font-family: var(--gothic); font-size: 11px; font-weight: 700; color: var(--ink-soft); border: 1px solid var(--line); padding: 0 5px; line-height: 18px; white-space: nowrap; }
  .speak {
    flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--rule);
    background: #fff; color: var(--navy); display: grid; place-items: center; padding: 0;
  }
  .speak svg { width: 18px; height: 18px; fill: currentColor; }
  .speak.small { width: 28px; height: 28px; margin-top: 2px; }
  .speak.small svg { width: 14px; height: 14px; }
  .e-ja { margin: 4px 0 0 2.9em; font-size: 17px; line-height: 1.5; }
  .ja-text { border-radius: 3px; padding: 0 2px; transition: background .15s, color .15s; }
  .hide-ja .e-ja:not(.shown) .ja-text { background: var(--red); color: var(--red); cursor: pointer; }
  .e-more { margin: 8px 0 0 2.9em; }
  .e-more summary { font-family: var(--gothic); font-size: 13px; color: var(--navy); cursor: pointer; list-style: none; padding: 4px 0; }
  .e-more summary::-webkit-details-marker { display: none; }
  .e-more summary::before { content: "▸ "; }
  .e-more[open] summary::before { content: "▾ "; }
  .ex { margin: 8px 0 0; padding-left: 10px; border-left: 2px solid var(--rule); }
  .ex-en { font-family: var(--latin); font-size: 16px; line-height: 1.55; margin: 0; display: flex; gap: 8px; align-items: flex-start; }
  .ex-en mark { background: none; color: inherit; font-weight: 700; text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .ex-ja { font-size: 14px; color: var(--ink-soft); margin: 2px 0 0 36px; }
  .note { font-size: 14px; line-height: 1.75; margin: 10px 0 0; }
  .exam { font-family: var(--gothic); font-size: 12px; color: var(--red); margin: 8px 0 0; }
  .exam::before { content: "出題 "; font-weight: 700; }
  .empty { font-family: var(--gothic); color: var(--ink-soft); font-size: 14px; padding: 24px 0; text-align: center; }
  .after { margin-top: 24px; }
</style>
</head>
<body>

1大学・1回）"],"physical therapist":["名","The physical therapist helped him walk again after the accident.","理学療法士は事故後、彼が再び歩けるよう手助けした。","Physical therapists design exercises for each patient.","理学療法士は患者ごとに運動メニューを作る。","「理学療法士」。physical therapy（理学療法、PT）を行う人。occupational therapist（作業療法士）、speech therapist（言語聴覚士）と並べて覚える。","調査した13大学53回分の過去問では未出（看護の基本語として収録）"],"informed consent":["名","Doctors must obtain informed consent before surgery.","医師は手術前に説明に基づく同意を得なければならない。","Informed consent means the patient understands the risks and agrees.","インフォームド・コンセントとは患者がリスクを理解したうえで同意することをいう。","informed（情報を与えられた）＋ consent（同意、基本単語にあり）。「説明と同意」。obtain / give informed consent。医療倫理の基本語。","調査した13大学53回分の過去問では未出（看護の基本語として収録）"],"medical ethics":["名","Medical ethics asks what doctors should and should not do.","医療倫理は医師が何をすべきで何をすべきでないかを問う。","Nursing students take a course in medical ethics.","看護学生は医療倫理の授業を受ける。","ethics（倫理）＋ medical。「医療倫理」。患者の自己決定、守秘義務、安楽死などを扱う。ethical（倫理的な）、unethical（倫理に反する）。","調査した13大学53回分の過去問では未出（看護の基本語として収録）"],"euthanasia":["名","Euthanasia is legal in only a few countries.","安楽死はごく少数の国でしか合法でない。","The debate over euthanasia raises difficult ethical questions.","安楽死をめぐる議論は難しい倫理的問題を提起する。","eu-（よい）＋ thanatos（死）。「安楽死」。mercy killing とも言う。医療倫理の長文や小論文で出るテーマ。","調査した13大学53回分の過去問では未出（看護の基本語として収録）"],"donor":["名","The patient is waiting for a kidney donor.","その患者は腎臓の提供者を待っている。","Blood donors are asked a few questions about their health.","献血者は健康についていくつか質問される。","donate（寄付する、提供する）する人。「臓器・血液の提供者、ドナー」。organ donor（臓器提供者）、blood donor（献血者）。受け取る側は recipient。","昭和医大2026（1大学・1回）"],"quality of life":["名","The new treatment improved the patients' quality of life.","新しい治療は患者の生活の質を改善した。","Pain control is essential for quality of life in terminal care.","痛みの管理は終末期ケアにおける生活の質に不可欠である。","「生活の質」。略して QOL。improve / maintain quality of life。延命だけでなく、どれだけ満足して生きられるかという考え方。","杏林2024・2025・聖路加2026（2大学・3回）"],"well-being":["名","Regular exercise improves both physical and mental well-being.","定期的な運動は体と心の両方の健康を高める。","Nurses care for the well-being of the whole person.","看護師は人の全体的な幸福に心を配る。","well（よく）＋ being（存在）。「幸福、健康で安心な状態」。WHO の健康の定義 a state of complete physical, mental and social well-being で有名。","東京医科大2024・杏林2026・聖路加2025・2026（3大学・4回）"],"compassion":["名","Nurses need both knowledge and compassion.","看護師には知識と思いやりの両方が必要だ。","She treated every patient with compassion.","彼女はすべての患者に思いやりをもって接した。","com-（共に）＋ passion（苦しみ）。「思いやり、共感」。with compassion、compassionate（思いやりのある）。sympathy（同情）より行動を伴う響き。","聖路加2026（1大学・2回）"],"fall":["名","Falls are the main cause of injury among older people.","転倒は高齢者のけがの主な原因である。","Nurses assess each patient's risk of falls.","看護師は患者ごとに転倒のリスクを評価する。","動詞「落ちる、倒れる」の名詞で「転倒」。a fall（1回の転倒）、fall prevention（転倒予防）。高齢者ケアの重要語。「秋」の意味もある（米）。","杏林2025・慈恵2025・北里2024・2026ほか5大学（8大学・11回）"],"chart":["名","The nurse wrote the patient's temperature on the chart.","看護師は患者の体温をカルテに書いた。","Doctors review the chart before seeing the patient.","医師は患者を診る前にカルテを確認する。","「図表」のほか、医療では「カルテ、診療記録」。medical chart、patient chart。日本語の「カルテ」はドイツ語 Karte から。","杏林2025・聖路加2025・東京医療保健2026（3大学・3回）"],"contract":["動","He contracted malaria while traveling in Africa.","彼はアフリカを旅行中にマラリアにかかった。","Nurses take care not to contract infections from patients.","看護師は患者から感染症をもらわないように注意する。","基本単語では「契約」。動詞で「（病気に）かかる」の意味があり、contract a disease。catch より硬い言い方。発音は動詞のとき後ろにアクセント（con-TRACT）。","杏林2024・2025・北里2024・聖路加2025ほか3大学（6大学・7回）"],"positive":["形","Her test for influenza came back positive.","彼女のインフルエンザ検査は陽性だった。","A positive result means the virus was found.","陽性の結果はウイルスが見つかったことを意味する。","基本単語では「積極的な、肯定的な」。検査では「陽性の」。test positive for ～（～で陽性になる）。陽性は「悪い知らせ」になることが多いので注意。","東京医科大2026・杏林2024・2026・北里2025ほか5大学（8大学・11回）"],"negative":["形","Luckily, the test result was negative.","幸い、検査結果は陰性だった。","Patients must test negative before they can leave quarantine.","患者は隔離を終える前に陰性にならなければならない。","基本単語では「否定の」。検査では「陰性の」。test negative、a negative result。positive（陽性）と対で覚える。","東京医科大2024・2026・杏林2026・聖路加2025・2026ほか5大学（8大学・11回）"],"lifestyle":["名","A healthy lifestyle includes enough sleep and regular exercise.","健康的な生活習慣には十分な睡眠と定期的な運動が含まれる。","Nurses give advice on lifestyle changes to patients with diabetes.","看護師は糖尿病の患者に生活習慣の改善について助言する。","life（生活）＋ style（様式）。「生活習慣、生活様式」。a healthy lifestyle、lifestyle changes（生活習慣の改善）、lifestyle-related disease（生活習慣病）。健康系の長文で最頻出の語の1つ。","杏林2024・聖路加2025・女子医大2025ほか1大学（4大学・6回）"],"diet":["名","A balanced diet is the key to good health.","バランスの取れた食事が健康の鍵である。","The doctor put him on a low-salt diet.","医師は彼に減塩食を指示した。","日本語の「ダイエット」ではなく、まず「ふだんの食事、食生活」。a balanced diet（バランスの取れた食事）、be on a diet（食事制限中である）。形容詞は dietary。","東京医科大2023・2024・2025・杏林2024・2025・北里2025・2026ほか4大学（7大学・13回）"],"eating habits":["名","Poor eating habits in childhood often continue into adulthood.","子どものころの悪い食習慣はしばしば大人になっても続く。","The nurse asked about the patient's eating habits.","看護師は患者の食習慣についてたずねた。","「食習慣」。habit（習慣）は基本単語にあり、eating / sleeping habits（食習慣・睡眠習慣）のように複数形で使うことが多い。healthy eating habits。","聖路加2026・獨協医大2026・東京医療保健2026（3大学・4回）"],"fat":["名","Too much fat in the diet raises cholesterol.","食事中の脂肪の取りすぎはコレステロールを上げる。","Body fat around the stomach is linked to heart disease.","おなかまわりの体脂肪は心臓病と関係がある。","形容詞「太った」のほか、名詞で「脂肪」。body fat（体脂肪）、saturated fat（飽和脂肪）、low-fat（低脂肪の）。人に対して fat と言うのは失礼なので、overweight を使う。","杏林2024・2025・自治医大2025・昭和医大2026ほか2大学（5大学・8回）"],"calorie":["名","This drink contains 200 calories.","この飲み物は200キロカロリーある。","Older people need fewer calories but the same nutrients.","高齢者は必要なカロリーは少なくなるが、栄養素は同じだけ必要だ。","「カロリー」。burn calories（カロリーを消費する）、calorie intake（カロリー摂取量）、low-calorie（低カロリーの）。形容詞 caloric（カロリーの）も出る。","自治医大2025・埼玉医大2026・昭和医大2026（3大学・3回）"],"carbohydrate":["名","Rice and bread are rich in carbohydrates.","米やパンは炭水化物が豊富だ。","Carbohydrates are the body's main source of energy.","炭水化物は体の主なエネルギー源である。","carbo（炭素）＋ hydrate（水化物）。「炭水化物」。会話では carbs と略す。protein（タンパク質）、fat（脂肪）と並ぶ三大栄養素。","杏林2025・昭和医大2024（2大学・2回）"],"caffeine":["名","Caffeine can keep you awake at night.","カフェインは夜眠れなくすることがある。","Pregnant women are advised to limit caffeine.","妊婦はカフェインを控えるよう勧められている。"," l amounts of lead are harmful to children.","ごく少量の鉛でも子どもには有害である。","harm（害）＋ -ful。「有害な」。be harmful to ～（～に有害である）。反対は harmless（無害の）。harmful effects（有害な影響）。","聖路加2026・女子医大2025・獨協医大2026ほか2大学（5大学・5回）"],"unhealthy":["形","Skipping breakfast is an unhealthy habit.","朝食を抜くのは不健康な習慣だ。","Unhealthy diets are a major cause of obesity.","不健康な食生活は肥満の主な原因である。","un-（否定）＋ healthy。「不健康な、健康に悪い」。an unhealthy diet / lifestyle。「顔色が悪い」の意味でも使う。","聖路加2026・東京医療保健2026（2大学・2回）"],"health problem":["名","Lack of sleep can lead to serious health problems.","睡眠不足は深刻な健康問題につながることがある。","Please tell the nurse about any health problems you have.","健康上の問題があれば看護師に伝えてください。","「健康問題、健康上の問題」。have a health problem。mental health problems（心の健康の問題）、chronic health problems（慢性的な健康問題）。","杏林2026・昭和医大2025・東京医療保健2026（3大学・6回）"],"health promotion":["名","Health promotion aims to help people control their own health.","健康増進とは、人々が自分の健康を管理できるよう助けることを目的とする。","Public health nurses play a key role in health promotion.","保健師は健康増進において重要な役割を果たす。","「健康増進」。promote（促進する）の名詞 promotion。病気を治すのではなく、健康を高める活動。WHO のオタワ憲章（1986）で広まった語。","東京医科大2024・聖路加2026・女子医大2025（3大学・3回）"],"prevention":["名","Prevention is better than cure.","予防は治療に勝る（ことわざ）。","Hand washing is the simplest form of infection prevention.","手洗いは最も簡単な感染予防である。","prevent の名詞形。「予防」。infection prevention（感染予防）、disease prevention（疾病予防）。preventive（予防の）、preventable（予防可能な）と語族で覚える。","聖路加2026・自治医大2024・東京医療保健2026（3大学・3回）"],"preventive":["形","Vaccination is a preventive measure against the flu.","予防接種はインフルエンザに対する予防策である。","Preventive medicine focuses on keeping people healthy.","予防医学は人々を健康に保つことに重点を置く。","「予防の、予防的な」。preventive measures（予防策）、preventive care / medicine（予防医療・予防医学）。preventative とも言う。","聖路加2025・自治医大2026（2大学・2回）"],"preventable":["形","Many cancers are preventable through lifestyle changes.","多くのがんは生活習慣の改善で予防できる。","Falls among the elderly are largely preventable.","高齢者の転倒はおおむね予防可能である。","prevent ＋ -able（～できる）。「予防可能な」。preventable death（防げる死）。女子医大2025の長文「がん死の3分の1は予防可能」で使われた。","聖路加2025・女子医大2025（2大学・2回）"],"prevent":["動","Wearing a mask helps prevent the spread of the virus.","マスクの着用はウイルスの拡散を防ぐのに役立つ。","Turning bedridden patients regularly prevents bedsores.","寝たきりの患者の体の向きを定期的に変えると床ずれを予防できる。","基本単語では「～をさまたげる」。医療では「～を予防する、防ぐ」。prevent A from doing（A が～するのを防ぐ）。名詞 prevention。53回分中18回に出た頻出語。","東京医科大2024・2025・2026・杏林2024・2025・2026・北里2026ほか6大学（9大学・18回）"],"risk factor":["名","Smoking is a major risk factor for heart disease.","喫煙は心臓病の主要な危険因子である。","Age is a risk factor that cannot be changed.","年齢は変えることのできない危険因子である。","「危険因子（病気になる確率を高める要因）」。a risk factor for ～（～の危険因子）。risk は基本単語。reduce the risk of ～（～のリスクを減らす）もセットで。","聖路加2026・女子医大2025（2大学・2回）"],"exposure":["名","Long exposure to the sun can cause skin cancer.","長時間日光にさらされると皮膚がんになることがある。","Health workers face daily exposure to infection.","医療従事者は毎日感染の危険にさらされている。","expose（さらす）の名詞形。「さらされること、曝露」。exposure to ～（～にさらされること）。放射線・化学物質・ウイルスなどへの曝露で使う。","杏林2024・2026・女子医大2025・自治医大2026（3大学・4回）"],"cold":["名","I caught a cold and stayed home.","風邪をひいて家にいた。","Antibiotics do not work against the common cold.","抗生物質は普通の風邪には効かない。","形容詞「寒い」の名詞用法で「風邪」。catch / have a cold（風邪をひく・ひいている）、the common cold（普通感冒）。flu（インフルエンザ）とは区別する。","東京医科大2024・2025・杏林2024・2025・2026・慈恵2025ほか6大学（9大学・14回）"],"waste":["名","The kidneys filter waste from the blood.","腎臓は血液から老廃物をこし取る。","Medical waste must be disposed of safely.","医療廃棄物は安全に処分しなければならない。","「むだ、廃棄物」のほか、体の中では「老廃物」。waste products（老廃物）、medical waste（医療廃棄物）。動詞では「むだにする」。","東京医科大2025・埼玉医大2025・昭和医大2024・2026ほか1大学（4大学・7回）"],"consume":["動","Japanese people consume a lot of salt.","日本人は塩分をたくさん摂取する。","Patients with kidney disease should not consume too much protein.","腎臓病の患者はタンパク質を取りすぎてはいけない。","基本単語では「消費する」。食べ物・飲み物については「～を摂取する、飲食する」。consume alcohol（飲酒する）。名詞 consumption。","自治医大2025・埼玉医大2025・昭和医大2024・2026ほか2大学（5大学・6回）"],"consumption":["名","Sugar consumption has doubled in fifty years.","砂糖の摂取量は50年で2倍になった。","Reducing alcohol consumption lowers blood pressure.","飲酒量を減らすと血圧が下がる。","consume の名詞形。「摂取（量）、消費」。alcohol / salt consumption（飲酒量・塩分摂取量）。昔は「結核」を意味する語でもあった。","杏林2024・北里2026・女子医大2024ほか3大学（6大学・6回）"],"ingredient":["名","Check the ingredients if you have a food allergy.","食物アレルギーがあるなら成分表示を確認しなさい。","The active ingredient in aspirin reduces fever.","アスピリンの有効成分は熱を下げる。","基本単語では「材料」。食品や薬では「成分」。active ingredient（有効成分）、ingredients list（成分表示）。","杏林2025・北里2025・埼玉医大2024ほか2大学（5大学・5回）"],"additive":["名","This juice contains no artificial additives.","このジュースには人工添加物が含まれていない。","Some food additives can trigger allergic reactions.","一部の食品添加物はアレルギー反応を引き起こすことがある。","add（加える）から。「添加物」。food additives（食品添加物）。形容詞では「付加的な」。杏林2025・国際医療福祉2025で語注つきで出た。","昭和医大2025・国際医療福祉2025（2大学・2回）"],"organic":["形","Organic vegetables are grown without chemical pesticides.","有機野菜は化学農薬を使わずに育てられる。","Organic food is often more expensive but not always more nutritious.","有機食品はたいてい高価だが、いつも栄養価が高いわけではない。","「有機の、有機栽培の」。organic food / farming。化学では「有機化合物の」、生物では「器官の」。昭和医大2025の長文テーマ。","女子医大2026・昭和医大2025・国際医療福祉2025（3大学・3回）"],"vegetarian":["名","My sister is a vegetarian and eats no meat or fish.","姉は菜食主義者で肉も魚も食べない。","Vegetarians need to make sure they get enough iron.","菜食主義者は鉄分を十分に取るよう気をつける必要がある。","「菜食主義者」。形容詞としても使い、a vegetarian diet（菜食）。卵や乳製品も食べない人は vegan。","獨協医大2025・国際医療福祉2025（2大学・2回）"],"supplement":["名","She takes a vitamin D supplement in winter.","彼女は冬にビタミンD のサプリメントを飲んでいる。","Supplements cannot replace a balanced diet.","サプリメントはバランスの取れた食事の代わりにはならない。","基本単語では動詞「補う」。名詞で「サプリメント、栄養補助食品」。dietary supplement。動詞と名詞でアクセントの位置が同じ（sup-ple-ment）。","北里2025・獨協医大2025・東京医療保健2026（3大学・3回）"],"nutritional":["形","Read the nutritional information on the package.","包装の栄養表示を読みなさい。","Elderly patients often have nutritional problems.","高齢の患者はしばしば栄養上の問題を抱える。","nutrition（栄養）の形容詞。「栄養の、栄養上の」。nutritional value（栄養価）、nutritional status（栄養状態）。nutritious は「栄養のある（食べ物）」。","杏林2024・2025・聖路加2026（2大学・3回）"],"fast food":["名","Eating fast food every day is bad for your health.","毎日ファストフードを食べるのは健康に悪い。","Fast food is high in salt, fat, and calories.","ファストフードは塩分・脂肪・カロリーが高い。","「ファストフード」。junk food（栄養価の低い食品）とともに肥満や生活習慣病の文章で出る。fast は「速い」で、fast（断食）ではない。","女子医大2026・国際医療福祉2025・東京医療保健2026（3大学・3回）"],"growth":["名","Good nutrition is essential for children's growth.","よい栄養は子どもの成長に不可欠である。","The nurse measured the baby's growth at each visit.","看護師は訪問のたびに赤ちゃんの発育を測定した。","grow の名詞形。「成長、発育、増加」。growth hormone（成長ホルモン）、population growth（人口増加）。医療では腫瘍などの「増殖物」の意味もある。","杏林2024・2025・2026・北里2026・聖路加2026ほか3大学（6大学・12回）"],"stress":["名","Too much stress can weaken the immune system.","過度のストレスは免疫系を弱めることがある。","Nurses often work under great stress.","看護師はしばしば大きなストレスの下で働く。","基本単語では動詞「強調する」。名詞「ストレス」は53回分中22回に出た医療系最頻出語。under stress（ストレスを受けて）、reduce / relieve stress、stress hormone（ストレスホルモン）。","東京医科大2023・2026・杏林2024・2025・2026・慈恵2025ほか9大学（12大学・22回）"],"stressful":["形","Exams are a stressful time for students.","試験は学生にとってストレスの多い時期だ。","Working in the emergency room is stressful but rewarding.","救急外来で働くのはストレスが多いがやりがいがある。","stress ＋ -ful。「ストレスの多い」。a stressful job / event。人が「ストレスを感じている」は stressed（out）。","東京医科大2026・慈恵2025・自治医大2025ほか1大学（4大学・4回）"],"cortisol":["名","Cortisol is released when we feel stress.","コルチゾールはストレスを感じたときに分泌される。","The study measured cortisol levels in dogs and their owners.","その研究は犬と飼い主のコルチゾール値を測定した。","「コルチゾール（ストレスホルモン）」。副腎から分泌され、血糖や免疫に影響する。女子医大2026・聖路加2026・自治医大2025・獨協2025 と4大学で出た。","聖路加2026・女子医大2026・獨協医大2025ほか1大学（4大学・4回）"],"dopamine":["名","Dopamine is linked to pleasure and motivation.","ドーパミンは快感や意欲と関係している。","Low levels of dopamine are found in Parkinson's disease.","パーキンソン病ではドーパミンの量が低下している。","「ドーパミン」。脳内の神経伝達物質の1つで、快感・意欲・運動の調節に関わる。北里2025・聖路加2026・女子医大2024 の長文で出た。","北里2025・聖路加2026・女子医大2024（3大学・3回）"],"neurotransmitter":["名","Neurotransmitters carry signals between nerve cells.","神経伝達物質は神経細胞の間で信号を伝える。","Serotonin is a neurotransmitter that affects mood.","セロトニンは気分に影響する神経伝達物質である。","neuro（神経）＋ transmitter（伝えるもの）。「神経伝達物質」。dopamine、serotonin、noradrenaline などの総称。女子医大2024では語注つき。","北里2025・聖路加2026・女子医大2024（3大学・3回）"],"endorphin":["名","Exercise releases endorphins that make you feel good.","運動すると気分をよくするエンドルフィンが放出される。","Laughter increases endorphins and reduces pain.","笑うとエンドルフィンが増えて痛みが和らぐ。","「エンドルフィン」。endogenous（体内の）＋ morphine（モルヒネ）から作られた語で、脳内で痛みを和らげる物質。ふつう複数形で使う。","北里2025・聖路加2026（2大学・2回）"],"neural":["形","Neural pathways in the brain change as we learn.","脳の神経回路は学ぶにつれて変化する。","The scan showed increased neural activity in the memory area.","スキャンは記憶の領域で神経活動が増えていることを示した。","neuron（神経細胞）の形容詞。「神経の」。neural network（神経回路網）、neural activity（神経活動）。nervous（神経の・神経質な）より学術的。","杏林2024・2025・北里2024（2大学・3回）"],"mood":["名","Sunlight can improve your mood.","日光は気分をよくすることがある。","The nurse noticed a change in the patient's mood.","看護師は患者の気分の変化に気づいた。","「気分、機嫌」。be in a good / bad mood（機嫌がよい・悪い）、mood disorder（気分障害）、mood swings（気分の浮き沈み）。","北里2025・聖路加2026・女子医大2026ほか2大学（5大学・7回）"],"emotional":["形","Patients need emotional support as well as medicine.","患者には薬だけでなく心の支えも必要だ。","She became emotional when she talked about her illness.","病気の話をするとき、彼女は感情的になった。","emotion（感情）の形容詞。「感情の、情緒的な、感情的な」。emotional support（心の支え）、emotional stress（精神的ストレス）。","東京医科大2023・杏林2024・2026・北里2025ほか2大学（5大学・6回）"],"relax":["動","Take a deep breath and relax your shoulders.","深呼吸して肩の力を抜いて。","Listening to music helps patients relax before surgery.","音楽を聴くことは手術前の患者がリラックスするのに役立つ。","「リラックスする、くつろぐ」と「～をゆるめる」。relax the muscles（筋肉をゆるめる）。名詞は relaxation。10大学で出た。","東京医科大2024・2026・杏林2024・2025・2026・北里2024・2025ほか7大学（10大学・16回）"],"relaxation":["名","Yoga is a popular form of relaxation.","ヨガは人気のあるリラックス法だ。","Relaxation techniques can lower blood pressure.","リラクゼーション法は血圧を下げることがある。","relax の名詞形。「リラックス、緊張の緩和」。relaxation techniques（リラクゼーション法）。筋肉の「弛緩」の意味でも使う。","獨協医大2026・自治医大2025（2大学・2回）"],"meditate":["動","She meditates for ten minutes every morning.","彼女は毎朝10分瞑想する。","Patients who meditate report less anxiety.","瞑想する患者は不安が少ないと報告している。","「瞑想する」。名詞 meditation（瞑想、基本単語にあり）。meditate on ～（～について深く考える）。ストレス対策の文章で出る。","杏林2025・北里2025（2大学・2回）"],"calm":["形","The nurse spoke in a calm voice.","看護師は穏やかな声で話した。","Deep breathing can calm an anxious patient.","深呼吸 ger a migraine.","強い光は片頭痛の引き金になることがある。","「片頭痛」。普通の headache より強く、吐き気や光への過敏を伴う。発音はイギリスでは「ミーグレイン」、アメリカでは「マイグレイン」。","北里2025・聖路加2026（2大学・2回）"],"hives":["名","He broke out in hives after eating shellfish.","彼は貝を食べたあと、じんましんが出た。","Hives are a common sign of an allergic reaction.","じんましんはアレルギー反応のよくある兆候である。","「じんましん」。常に複数形で使う。break out in hives（じんましんが出る）。医学用語では urticaria。自治医大2026の対話で出た。","杏林2024・自治医大2026（2大学・2回）"],"discomfort":["名","You may feel some discomfort after the injection.","注射のあとに多少の不快感があるかもしれません。","The nurse adjusted the pillow to ease his discomfort.","看護師は彼の不快感を和らげるために枕を直した。","dis-（否定）＋ comfort（快適さ）。「不快感、軽い痛み」。pain より軽い症状を伝えるときに医療者がよく使う語。","慈恵2025・獨協医大2026・帝京2026（3大学・3回）"],"damage":["名","Smoking causes damage to the lungs.","喫煙は肺に損傷を与える。","Brain damage from a stroke can affect speech.","脳卒中による脳の損傷は言葉に影響することがある。","「損傷、損害」。cause damage to ～（～に損傷を与える）、brain / liver damage。動詞でも使う。数えられない名詞なので a damage とは言わない。","杏林2024・慈恵2025・聖路加2025・2026ほか4大学（7大学・10回）"],"injured":["形","Three people were seriously injured in the crash.","その衝突で3人が重傷を負った。","The injured player was carried off on a stretcher.","負傷した選手は担架で運び出された。","injure（傷つける、基本単語にあり）の過去分詞。「負傷した」。be injured（けがをする）、the injured（負傷者たち）。","埼玉医大2024・国際医療福祉2025・東京医療保健2026（3大学・3回）"],"appointment":["名","I have a doctor's appointment at three.","3時に医者の予約がある。","Please call to change your appointment.","予約を変更する場合はお電話ください。","基本単語では「約束、予約」。医療では「診察の予約」。make an appointment with a doctor（医師の診察を予約する）。病院の会話文で頻出。","杏林2025・自治医大2024・国際医療福祉2025（3大学・3回）"],"follow-up":["名","Come back for a follow-up in two weeks.","2週間後に経過観察に来てください。","A follow-up study tracked the patients for ten years.","追跡調査は患者を10年間追った。","follow up（追跡する）の名詞。「経過観察、追跡調査」。a follow-up visit / appointment（再診）。形容詞的にも使う。","女子医大2024・埼玉医大2026（2大学・2回）"],"dentist":["名","You should see a dentist twice a year.","年に2回は歯科医に診てもらうべきだ。","The dentist found two cavities.","歯科医は虫歯を2本見つけた。","dent-（歯）＋ -ist。「歯科医」。go to the dentist（歯医者に行く）。dental（歯の）、dentistry（歯学）。聖路加2026の口腔保健の長文で関連語が多く出た。","杏林2025・国際医療福祉2025（2大学・2回）"],"pupil":["名","The pupil gets smaller in bright light.","瞳孔は明るい光の中で小さくなる。","The doctor shone a light to check the patient's pupils.","医師は患者の瞳孔を確認するために光を当てた。","「生徒」のほか、目の「瞳孔」。意識レベルの確認で pupil reaction（対光反射）を見る。杏林2026（語注つき）・慈恵2025・自治医大で出た。","杏林2026・慈恵2025・自治医大2024（3大学・3回）"],"vision":["名","Reading in dim light does not damage your vision.","暗いところで読んでも視力は悪くならない。","Cataracts cause blurred vision.","白内障はかすみ目を引き起こす。","「視力、視覚」と「展望、ビジョン」。blurred vision（かすみ目）、vision loss（視力の低下）、eyesight もほぼ同じ意味。","杏林2026・慈恵2025・聖路加2025・2026ほか3大学（6大学・7回）"],"tongue":["名","The doctor asked me to stick out my tongue.","医師は私に舌を出すように言った。","Taste buds on the tongue detect sweet, salty, sour, and bitter.","舌の味蕾は甘味・塩味・酸味・苦味を感じ取る。","「舌、言語」。stick out one's tongue（舌を出す）、mother tongue（母語）。発音は「タング」。","東京医科大2023・杏林2024・自治医大2024ほか1大学（4大学・4回）"],"bone":["名","Calcium and vitamin D keep bones strong.","カルシウムとビタミンD は骨を丈夫に保つ。","Older women are at risk of bone loss.","高齢の女性は骨量の減少のリスクがある。","「骨」。bone density（骨密度）、bone loss（骨量の減少）、broken bone（骨折）。骨粗しょう症（osteoporosis）の文章で出る。","杏林2024・2025・聖路加2026・女子医大2026ほか2大学（5大学・6回）"],"skin":["名","Dry skin is common in winter.","冬は乾燥肌になりやすい。","Nurses check the skin of bedridden patients for sores.","看護師は寝たきりの患者の皮膚にただれがないか確認する。","「皮膚、肌」。skin cancer（皮膚がん）、skin care（スキンケア）。体の最大の臓器で、感染を防ぐ第一の壁として説明される。","杏林2024・慈恵2025・女子医大2026ほか3大学（6大学・7回）"],"birth":["名","The baby weighed three kilograms at birth.","赤ちゃんは出生時に3キロあった。","Japan's birth rate has been falling for decades.","日本の出生率は何十年も下がり続けている。","「出産、誕生、出生」。give birth to ～（～を出産する）、birth rate（出生率）、date of birth（生年月日）。","杏林2025・北里2024・女子医大2025ほか1大学（4大学・4回）"],"breast":["名","Breast cancer is the most common cancer among women.","乳がんは女性に最も多いがんである。","Breast milk protects babies from infection.","母乳は赤ちゃんを感染から守る。","「乳房、胸」。breast cancer（乳がん）、breastfeeding（母乳育児）、breast milk（母乳）。chest は「胸部」全体。","杏林2025・女子医大2025（2大学・2回）"],"rejection":["名","The patient takes drugs to prevent rejection of the new kidney.","患者は新しい腎臓の拒絶反応を防ぐために薬を飲んでいる。","Organ rejection is the biggest risk after a transplant.","臓器の拒絶反応は移植後の最大のリスクである。","reject（拒絶する）の名詞形。移植医療では「拒絶反応」。一般には「拒否、不採用」。昭和医大2026の臓器培養の長文で語注つきで出た。","埼玉医大2024・昭和医大2026（2大学・2回）"],"epidemiological":["形","Epidemiological studies look at disease in large groups of people.","疫学研究は大きな集団における病気を調べる。","Epidemiological data showed a link between smoking and cancer.","疫学データは喫煙とがんの関連を示した。","epidemiology（疫学：集団の中での病気の広がりを調べる学問）の形容詞。「疫学の」。epidemic（流行）と同じ語源。","聖路加2026・女子医大2024（2大学・2回）"],"disposable":["形","Nurses wear disposable gloves for each patient.","看護師は患者ごとに使い捨ての手袋を着ける。","Disposable masks should not be reused.","使い捨てマスクは再使用すべきでない。","dispose（処分する）＋ -able。「使い捨ての」。disposable gloves / syringes（使い捨て手袋・注射器）。「自由に使える」の意味もある（disposable income 可処分所得）。","獨協医大2025・昭和医大2026（2大学・2回）"],"persistent":["形","See a doctor if you have a persistent cough.","せきが続くなら医師に診てもらいなさい。","Persistent pain affects sleep and mood.","持続する痛みは睡眠と気分に影響する。","persist（続く）の形容詞。「持続性の、しつこい、根気強い」。a persistent cough（長引くせき）、persistent pain。","東京医科大2026・自治医大2025（2大学・2回）"],"unwell":["形","I'm feeling unwell, so I'll go home early.","体調が悪いので早めに帰ります。","Staff who feel unwell should not come to work.","体調が悪い職員は出勤すべきでない。","un-（否定）＋ well（健康な）。「体調が悪い」。feel unwell。sick や ill よりやわらかい言い方で、イギリス英語で多い。","聖路加2025・女子医大2025（2大学・2回）"],"bath":["名","A warm bath before bed helps you sleep.","寝る前の温かい入浴は眠りを助ける。","The nurse helped the elderly man take a bath.","看護師はその高齢男性の入浴を手伝った。","「入浴、風呂」。take a bath（入浴する）、bed bath（清拭）。動詞は bathe（入浴する・させる）で、bathing（入浴）は介護の基本語。","東京医科大2023・昭和医大2026（2大学・2回）"],"correlation":["名","There is a strong correlation between smoking and lung cancer.","喫煙と肺がんの間には強い相関がある。","Correlation does not always mean causation.","相関は必ずしも因果関係を意味しない。","co-（共に）＋ relation（関係）。「相関、相関関係」。a correlation between A and B。研究結果を述べる長文で頻出。","女子医大2026・獨協医大2025（2大学・2回）"],"restriction":["名","The doctor placed restrictions on his salt intake.","医師は彼の塩分摂取に制限を設けた。","Visiting restrictions were introduced during the outbreak.","流行の間、面会制限が導入された。","restrict（制限する）の名詞形。「制限」。dietary restrictions（食事制限）、visiting restrictions（面会制限）。","北里2024・女子医大2024・獨協医大2025（3大学・3回）"],"coronavirus":["名","The coronavirus spread around the world in 2020.","コロナウイルスは2020年に世界中に広がった。","Hospitals set up special wards for coronavirus patients.","病院はコロナウイルスの患者のために特別病棟を設けた。","corona（王冠）＋ virus。「コロナウイルス」。表面の突起が王冠のように見えることから。COVID-19 はこのウイルスによる病気の名前。","東京医科大2024・聖路加2025（2大学・2回）"],"sex":["名","Please write your name, age, and sex on the form.","用紙に氏名・年齢・性別を記入してください。","Heart attack symptoms can differ by sex.","心臓発作の症状は性別によって異なることがある。","「性別」。医療の問診票や研究では生物学的な性別を sex、社会的・文化的な性を gender と区別する。","杏林2025・2026・北里2024・聖路加2026ほか1大学（4大学・5回）"],"developmental":["形","Every child reaches developmental milestones at a different pace.","子どもはそれぞれ違うペースで発達の節目を迎える。","Developmental disorders are often noticed at school age.","発達障害はしばしば学齢期に気づかれる。","development（発達）の形容詞。「発達の、発達上の」。developmental disorder（発達障害）、developmental stage（発達段階）。","北里2024・昭和医大2026（2大学・2回）"],"old age":["名","Many people stay active well into old age.","多くの人は老年になってもずっと活動的でいる。","Hearing loss is common in old age.","難聴は老年期によく見られる。","「老年、老齢」。in old age（老年期に）。old-age pension（老齢年金）。高齢化の長文では aging、the elderly とともに出る。","東京医科大2024・杏林2026・北里2026ほか1大学（4大学・4回）"],"aging":["名","Japan has the fastest aging population in the world.","日本は世界で最も速く高齢化している。","Exercise slows some effects of aging.","運動は老化の影響の一部を遅らせる。","age（年をとる）の名詞形。「高齢化、老化」。an aging society / population（高齢化社会・人口）、the aging process（老化の過程）。イギリスつづりは ageing。","北里2024・2026・聖路加2025・女子医大2025（3大学・4回）"],"dependent":["形","Bedridden patients are dependent on others for daily care.","寝たきりの患者は日常のケアを他の人に頼っている。","The number of dependent elderly people is rising.","要介護の高齢者の数は増えている。","depend（頼る）の形容詞。「頼っている、依存した」。be dependent on ～（～に頼っている）。反対は independent（自立した）。名詞 dependence。","杏林2026・北里2024・聖路加2026ほか1大学（4大学・5回）"],"inequality":["名","Health inequality between rich and poor is growing.","富める人と貧しい人の間の健康格差は広がっている。","Nurses can help reduce inequality in access to care.","看護師は医療へのアクセスの格差を減らす助けになれる。","in-（否定）＋ equality（平等）。「不平等、格差」。health inequality（健康格差）、social inequality（社会的不平等）。聖路加の health equity（健康の公平）の長文と関連。","杏林2026・北里2024・聖路加2025・2026（3大学・5回）"],"health care worker":["名","Health care workers were the first to receive the vaccine.","医療従事者が最初にワクチンを受けた。","Health care workers must wash their hands between patients.","医療従事者は患者ごとに手を洗わなければならない。","「医療従事者（医師・看護師・技師など医療に関わる職員の総称）」。healthcare worker と1語でも書く。東京医療保健2026の全長文の結びの段落で繰り返し出た。","東京医療保健2026（1大学・4回）"],"professional":["名","Ask a health professional before taking supplements.","サプリメントを飲む前に医療の専門家に相談しなさい。","Nurses are trained professionals, not just helpers.","看護師は訓練を受けた専門職であり、単なる補助者ではない。","形容詞「専門的な、プロの」と名詞「専門職の人、専門家」。health professional（医療専門職）、medical professional。7大学で出た。","東京医科大2025・杏林2024・2025・北里2024・2025ほか4大学（7大学・10回）"],"care":["名","Good nursing care speeds up recovery.","よい看護は回復を早める。","Patients with dementia need round-the-clock care.","認知症の患者には24時間のケアが必要だ。","「世話、ケア、看護、介護」。medical care（医療）、nursing care（看護・介護）、take care of ～（～の世話をする）、care for（世話をする）。13大学すべてで出た最頻出語。","東京医科大2023・2024・2025・2026・杏林2024・2025・2026・慈恵2025ほか10大学（13大学・29回）"],"ethical":["形","Doctors face ethical questions about end-of-life care.","医師は終末期ケアをめぐる倫理的な問題に直面する。","Using patients' data without consent is not ethical.","同意なく患者のデータを使うのは倫理的でない。","ethics（倫理）の形容詞。「倫理的な、倫理の」。an ethical issue / question（倫理的問題）、ethical standards（倫理基準）。反対は unethical。","杏林2026・聖路加2025・獨協医大2026（3大学・3回）"],"resilient":["形","Children are often more resilient than adults expect.","子どもはしばしば大人が思うより立ち直りが早い。","Resilient nurses recover quickly from stressful shifts.","回復力のある看護師はストレスの多い勤務からすぐに立ち直る。","「回復力のある、立ち直りが早い、弾力のある」。名詞 resilience（レジリエンス、回復力）は心の健康の文章で頻出。","聖路加2025・昭和医大2024（2大学・3回）"],"participant":["名","The participants in the study were all over sixty.","その研究の参加者は全員60歳以上だった。","Each participant received either the drug or a placebo.","各参加者は薬か偽薬のどちらかを受け取った。","participate（参加する）＋ -ant（人）。「参加者、（研究の）被験者」。study participants。研究を紹介する長文で、subject（被験者）の代わりによく使われる。","東京医科大2026・杏林2024・慈恵2025ほか4大学（7大学・7回）"],"effective":["形","The vaccine is highly effective against the virus.","そのワクチンはウイルスに対して非常に効果がある。","Hand washing is the most effective way to prevent infection.","手洗いは感染を防ぐ最も効果的な方法だ。","effect（効果）の形容詞。「効果的な、有効な」。be effective against / in ～。名詞 effectiveness（有効性）。11大学で出た。efficient（効率的な）と混同しない。","東京医科大2025・杏林2024・2026・慈恵2025ほか8大学（11大学・15回）"],"senior":["名","Many seniors live alone in Japan.","日本では多くの高齢者が一人暮らしをしている。","The clinic offers free flu shots for seniors.","その診療所は高齢者に無料でインフルエンザの注射を提供している。","基本単語では形容詞「上級の、先輩の」。名詞で「高齢者、年長者」。senior citizen（高齢者）。elderly より丁寧な言い方として使われる。","東京医科大2024・2025・杏林2026・北里2024ほか1大学（4大学・5回）"],"repair":["動","The body repairs damaged cells while we sleep.","体は眠っている間に傷ついた細胞を修復する。","Surgeons repaired the torn ligament.","外科医は断裂した靭帯を修復した。","基本単語では「～を修理する」。体については「（組織・細胞）を修復する」。tissue repair（組織の修復）。名詞としても使う。","聖路加2025・女子医大2024・獨協医大2025ほか2大学（5大学・7回）"],"chemical":["名","Some chemicals in cigarettes cause cancer.","たばこの中の一部の化学物質はがんを引き起こす。","The brain releases chemicals that control mood.","脳は気分を調節する化学物質を放出する。","基本単語では形容詞「化学的な」。名詞で「化学物質」。brain chemicals（脳内物質）、harmful chemicals（有害化学物質）。","北里2025・聖路加2026・獨協医大2026ほか2大学（5大学・5回）"],"underlying":["形","Fever is a sign of an underlying infection.","発熱は根底に感染があることのしるしだ。","People with underlying health conditions are at higher risk.","基礎疾患のある人はリスクが高い。","underlie（根底にある）の現在分詞。「根底にある、基礎にある」。underlying condition / disease（基礎疾患）、underlying cause（根本原因）。コロナ関連の文章で頻出。","北里2024・聖路加2025・自治医大2024・2025（3大学・5回）"],"advocate":["名","Nurses act as advocates for their patients.","看護師は患者の代弁者として行動する。","She is a strong advocate of preventive care.","彼女は予防医療の強力な支持者である。","基本単語では動詞「主張する」。名詞で「擁護者、代弁者、支持者」。patient advocate（患者の権利を守る人）は看護の重要な役割。名詞は「アドヴォキット」と発音。","杏林2025・聖路加2025・昭和医大2024（3大学・3回）"],"WHO":["名","The WHO declared the outbreak a global emergency.","WHO はその流行を世界的な緊急事態と宣言した。","According to the WHO, one in eight people lives with obesity.","WHO によれば8人に1人が肥満である。","World Health Organization（世界保健機関）の略。国連の専門機関で、本部はジ 「うつ病」の意味（＝ a mental illness）。「不況」「くぼみ」の意味もある。",""],"complaint":["","Back pain is a common complaint among nurses.","腰痛は看護師によくある不調だ。","","","ここでは「（体の）不調・病気」の意味（＝ health problem）。ふつうは「不満・苦情」。",""],"on account of":["","He was absent from school on account of illness.","彼は病気のため学校を休んだ。","","","ここでは「～のために（理由）」の意味（＝ because of）。",""],"ward":["","She works in the children's ward of the hospital.","彼女はその病院の小児病棟で働いている。","","","ここでは「病棟」の意味（＝ section）。「（都市の）区」の意味もある。",""],"organ":["","The heart and the lungs are vital organs.","心臓と肺は生命に欠かせない臓器だ。","","","ここでは「臓器」の意味（＝ body parts）。「オルガン」「機関」の意味もある。",""],"pupil":["","The doctor shone a light to check the size of his pupils.","医師は光を当てて彼の瞳孔の大きさを確かめた。","","","ここでは「瞳孔」の意味（＝ the black centers of the eyes）。ふつうは「生徒」。",""],"sore":["","I have a sore throat and a slight fever.","のどが痛くて、少し熱がある。","","","ここでは「痛い・ひりひりする」の意味（＝ painful）。「腹を立てた」（アメリカの口語）の意味もある。",""],"make ends meet":["","It is hard to make ends meet on such a low salary.","こんなに安い給料ではやりくりが大変だ。","","","ここでは「やりくりする」の意味（＝ live within one's income）。「収入の範囲で暮らす」という意味。","東京医科大2024"]}};
