<script>
"use strict";

// ---- 単語データ ----
// 単語リストごとに [番号, 英語, 日本語, 品詞, 日本語の形, 意味の見出し, 新マーク]
// 多義語（kind: "choice"）は [番号, 見出し, 意味, 英文（下線部を[ ]）, 選択肢4つ, 正解の位置, 出題]
//   英文の下線部に最も意味が近いものを、決まった4つの選択肢から選ぶ（東京医科大 第1問の形式）
const LISTS = LISTS_DATA.map((l) => {
  const W = l.kind === "choice"
    ? l.words.map(([no, en, ja, s, ch, a, src]) => ({ no, en, ja, s, ch, a, src, pos: "", form: "", keys: new Set(), nw: 0 }))
    : l.words.map(([no, en, ja, pos, form, keys, nw]) => ({ no, en, ja, pos, form, keys: new Set(keys), nw }));
  return {
    id: l.id,
    name: l.name,
    kind: l.kind || "word",
    block: l.block || 0,   // 1回分の問題数（範囲タイルを「第◯回」で区切る）
    note: l.note || "",
    unit: l.kind === "choice" ? "問" : "語",
    W,
    byNo: new Map(W.map((w) => [w.no, w])),
    minNo: W.reduce((m, w) => Math.min(m, w.no), Infinity),
    maxNo: W.reduce((m, w) => Math.max(m, w.no), 0),
  };
});
const findList = (id) => LISTS.find((l) => l.id === id);

const $app = document.getElementById("app");
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 保存できなくても動く */ } },
};
function shuffle(arr, rnd = Math.random) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
const overlaps = (a, b) => { for (const k of a) if (b.has(k)) return true; return false; };
let keyHandler = null; // いまの画面のキーボード操作（PC用: 1〜4・Enter）
document.addEventListener("keydown", (ev) => { if (keyHandler && !ev.metaKey && !ev.ctrlKey && !ev.altKey) keyHandler(ev); });

// ================= 記録 =================
// この端末のブラウザに保存する（単語リストごと）
//   vt3:progress:<リストID> = { 番号: { s: 連続正解数, m: ×印, p: 合格, w: まちがえた回数 } }
//   vt3:quiz                = 解いている（解き終わった）テスト
//   vt3:prefs               = 最後に選んだリストと範囲
const PASS_STREAK = 2;   // 何回続けて正解したら合格か
const REVIEW_MAX = 30;   // 「まちがえた問題だけ解く」1回あたりの単語数
const QUIZ_KEY = "vt3:quiz";
const progressKey = (l) => `vt3:progress:${l}`;
const loadProgress = (l) => store.get(progressKey(l)) || {};
const saveProgress = (l, p) => store.set(progressKey(l), p);

// ---- 進み具合 ----
// 単語ごとの状態  p: 合格 / a: あと1回で合格 / m: ×印 / n: まだ
function wordState(r) {
  if (!r) return "n";
  if (r.p) return "p";
  if (r.m) return "m";
  return r.s >= 1 ? "a" : "n";
}
// 番号 s〜e の単語を状態ごとに数える（%は「合格」の割合）
function countStates(list, prog, s = list.minNo, e = list.maxNo) {
  const c = { p: 0, a: 0, m: 0, n: 0, total: 0 };
  for (const w of list.W) {
    if (w.no < s || w.no > e) continue;
    c[wordState(prog[w.no])] += 1;
    c.total += 1;
  }
  return c;
}
const pctOf = (n, total) => (total ? Math.floor((n / total) * 100) : 0); // 切り捨て（全部合格のときだけ100%）
const share = (n, total) => (total ? (n / total) * 100 : 0);
// 横の帯グラフ。gain = 今回のテストで新しく合格した語数（しま模様で伸びる）
function stackBar(c, cls = "", gain = 0) {
  const g = Math.max(0, Math.min(gain, c.p));
  return `<div class="sbar ${cls}" aria-hidden="true">`
    + `<i class="p" style="width:${share(c.p - g, c.total)}%"></i>`
    + (g ? `<i class="g" style="width:${share(g, c.total)}%"></i>` : "")
    + `<i class="a" style="width:${share(c.a, c.total)}%"></i>`
    + `<i class="m" style="width:${share(c.m, c.total)}%"></i></div>`;
}
function ringStyle(c) {
  const p = share(c.p, c.total), a = p + share(c.a, c.total), m = a + share(c.m, c.total);
  return `background:conic-gradient(var(--red) 0 ${p}%, var(--c-a) 0 ${a}%, var(--c-m) 0 ${m}%, var(--c-n) 0)`;
}
// 範囲タイル: 単語が多いリストは100語ずつ、少ないリストは50語ずつ。多義語は1回分（5問）ずつ
function progressBlocks(list) {
  const size = list.block || (list.W.length > 600 ? 100 : 50);
  const blocks = [];
  for (let s = Math.floor((list.minNo - 1) / size) * size + 1; s <= list.maxNo; s += size) {
    const e = Math.min(s + size - 1, list.maxNo);
    if (list.W.some((w) => w.no >= s && w.no <= e)) blocks.push({ s, e });
  }
  return blocks;
}

function markedWords(list) {
  const p = loadProgress(list.id);
  return list.W.filter((w) => p[w.no] && p[w.no].m);
}
// 1問答えるたびに記録する。正解が PASS_STREAK 回続いたら合格、まちがえたら×印
function recordAnswer(listId, no, ok) {
  const prog = loadProgress(listId);
  const r = prog[no] || { s: 0, m: false, p: false, w: 0 };
  let justPassed = false;
  if (ok) {
    r.s += 1;
    if (r.s >= PASS_STREAK) {
      if (!r.p) justPassed = true;
      r.p = true;
      r.m = false;
    }
  } else {
    r.s = 0; r.m = true; r.p = false; r.w += 1;
  }
  prog[no] = r;
  saveProgress(listId, prog);
  return { streak: r.s, justPassed };
}

// ================= 問題づくり =================
// 選択肢は generate_test.py の pick_choices と同じ考え方（品詞と日本語の形をそろえる）
function makeQuestion(W, q) {
  // 多義語: 選択肢は決まっている（本番と同じくアルファベット順のまま出す）
  if (q.ch) return { choices: q.ch.slice(), answer: q.ch[q.a] };
  const pool = W.filter((w) => w.en !== q.en && w.ja !== q.ja && !overlaps(w.keys, q.keys));
  const tiers = [
    pool.filter((w) => w.pos === q.pos && w.form === q.form),
    pool.filter((w) => w.pos === q.pos && w.form !== q.form),
    pool.filter((w) => w.pos !== q.pos),
  ];
  const used = new Set([q.ja]);
  const dummies = [];
  for (const tier of tiers) {
    for (const w of shuffle(tier.slice())) {
      if (dummies.length === 3) break;
      if (used.has(w.ja)) continue;
      used.add(w.ja);
      dummies.push(w.ja);
    }
  }
  return { choices: shuffle([q.ja, ...dummies]), answer: q.ja };
}

// テストに出す単語を選ぶ: まだ合格していない単語を優先し、足りないときだけ合格済みを混ぜる
function pickNos(list, s, e, n) {
  const prog = loadProgress(list.id);
  const target = list.W.filter((w) => w.no >= s && w.no <= e);
  const passed = (w) => !!(prog[w.no] && prog[w.no].p);
  const notYet = shuffle(target.filter((w) => !passed(w)).map((w) => w.no));
  const done = shuffle(target.filter(passed).map((w) => w.no));
  return [...notYet, ...done].slice(0, Math.min(n, target.length));
}

function startQuiz(list, nos, mode, meta) {
  // base = はじめる前の合格語数（結果画面で「何%→何%」を出すため。復習はリスト全体）
  const base = countStates(list, loadProgress(list.id), meta.s ?? list.minNo, meta.e ?? list.maxNo).p;
  // 多義語のテストは本番と同じく番号順（1回分の 1〜5 の順）。それ以外はばらばらに
  const order = list.kind === "choice" && mode === "test" ? nos.slice().sort((a, b) => a - b) : shuffle(nos.slice());
  const quiz = { l: list.id, mode, ...meta, base, queue: order, i: 0, log: [], passed: [], t0: Date.now(), cur: null, done: false };
  store.set(QUIZ_KEY, quiz);
  if (location.hash === "#quiz") route(); else location.hash = "#quiz";
}
function startReview(list) {
  const nos = shuffle(markedWords(list).map((w) => w.no)).slice(0, REVIEW_MAX);
  if (!nos.length) { location.hash = ""; return; }
  startQuiz(list, nos, "review", {});
}

// ================= ホーム =================
function showHome() {
  keyHandler = null;
  const prefs = store.get("vt3:prefs") || {};
  const list = findList(prefs.l) || LISTS[0];
  const range = (prefs.ranges && prefs.ranges[list.id]) || {};
  const s0 = range.s || list.minNo, e0 = range.e || list.maxNo, n0 = range.n || list.block || 20;
  const U = list.unit;
  const marked = markedWords(list);
  const prog = loadProgress(list.id);
  const all = countStates(list, prog);
  const pAll = pctOf(all.p, all.total);
  const tiles = [{ s: list.minNo, e: list.maxNo, all: true }, ...progressBlocks(list)];
  const quiz = store.get(QUIZ_KEY);
  const resumable = quiz && !quiz.done && findList(quiz.l) && Array.isArray(quiz.queue) && quiz.i < quiz.queue.length;
  document.title = "英単語テスト";

  $app.innerHTML = `
    <article class="sheet">
      <header class="head">
        <p class="kicker">英単語テスト</p>
        <h1 class="title">単語テスト</h1>
        <p class="range">1問ずつ4択で答えます。まちがえた単語には ×印 が付き、×印の単語は${PASS_STREAK}回続けて正解すると「合格」です。</p>
        ${list.note ? `<p class="list-note">${esc(list.note)}</p>` : ""}
      </header>

      ${resumable ? `
      <div class="resume">
        <span>解きかけのテストがあります（${esc(findList(quiz.l).name)}・${quiz.mode === "review" ? "まちがえた問題" : `${quiz.i}/${quiz.queue.length}問`}）</span>
        <button class="btn" id="resume">続きから</button>
      </div>` : ""}

      ${LISTS.length > 1 ? `
      <div class="form-row"><span class="label">単語リスト</span>
        <div class="picker">${LISTS.map((l) => {
          const st = countStates(l, loadProgress(l.id));
          return `<label class="option"><input type="radio" name="l" value="${esc(l.id)}" ${l === list ? "checked" : ""}>
            <span class="opt-body">${esc(l.name)}<small>${l.W.length}${l.unit}・合格 ${pctOf(st.p, st.total)}%（${st.p}${l.unit}）${st.m ? `・×印 ${st.m}${l.unit}` : ""}</small>${stackBar(st, "mini")}</span></label>`;
        }).join("")}
        </div>
      </div>` : ""}

      <h2 class="section-title">進み具合</h2>
      <div class="prog">
        <div class="ring" style="${ringStyle(all)}" role="img" aria-label="${esc(list.name)} 合格 ${pAll}%">
          <div class="ring-in"><strong>${pAll}<span>%</span></strong><small>合格</small></div>
        </div>
        <ul class="legend">
          <li><span class="sw p"></span>合格<span class="v">${all.p}<small>${U}</small></span></li>
          <li><span class="sw a"></span>あと1回で合格<span class="v">${all.a}<small>${U}</small></span></li>
          <li><span class="sw m"></span>×印<span class="v">${all.m}<small>${U}</small></span></li>
          <li><span class="sw n"></span>まだ<span class="v">${all.n}<small>${U}</small></span></li>
        </ul>
      </div>
      <p class="prog-note">${esc(list.name)} 全${all.total}${U}のうち <b>${all.p}${U}</b> 合格。${all.p === all.total ? "全部合格です！" : `のこり ${all.total - all.p}${U}。`}2回続けて正解すると合格になります。</p>

      <h2 class="section-title">テストを解く</h2>
      <div class="form-row"><span class="label">出題範囲（タップで選ぶ）</span>
        <div class="blocks" id="blocks">
          ${tiles.map((b) => {
            const c = countStates(list, prog, b.s, b.e);
            const full = c.total > 0 && c.p === c.total;
            const pc = pctOf(c.p, c.total);
            const kai = list.block && !b.all ? Math.floor((b.s - list.minNo) / list.block) + 1 : 0;
            const name = b.all ? "全部" : kai ? `第${kai}回（No.${b.s}〜${b.e}）` : `No.${b.s}〜${b.e}`;
            return `<button class="blk ${full ? "full" : ""}" data-s="${b.s}" data-e="${b.e}" aria-pressed="false" style="--f:${share(c.p, c.total)}%" aria-label="${name}　合格${pc}%"><span class="r">${b.all ? "全部" : kai ? `第${kai}回` : `${b.s}–${b.e}`}</span><b>${full ? "合格" : `${pc}%`}</b></button>`;
          }).join("")}
        </div>
        <div class="range-row">
          <span class="by">番号で</span>
          <input class="field" id="s" type="number" inputmode="numeric" min="${list.minNo}" max="${list.maxNo}" value="${s0}" aria-label="開始番号">
          <span>〜</span>
          <input class="field" id="e" type="number" inputmode="numeric" min="${list.minNo}" max="${list.maxNo}" value="${e0}" aria-label="終了番号">
        </div>
        <div class="range-stat" id="rangeStat"></div>
      </div>
      <div class="form-row"><label class="label" for="n">問題数</label><input class="field" id="n" type="number" inputmode="numeric" min="1" value="${n0}"></div>
      <p class="hint" id="hint" role="alert"></p>
      <button class="btn wide" id="start">テストをはじめる</button>

      <h2 class="section-title">まちがえた問題</h2>
      ${marked.length ? `
        <p class="small" style="margin:0 0 10px">×印の単語が <b>${marked.length}語</b> あります。合格するまで何度も出題されます。${PASS_STREAK}回続けて正解すると合格して、×印が消えます。</p>
        <button class="btn wide red" id="review">まちがえた問題だけ解く（${Math.min(marked.length, REVIEW_MAX)}語）</button>
        <ul class="marklist">
          ${marked.slice(0, 60).map((w) => {
            const s = Math.min((prog[w.no] && prog[w.no].s) || 0, PASS_STREAK);
            return `<li><span class="x">×</span><span class="en" lang="en">${esc(w.en)}</span><span class="dots" aria-label="合格まであと${PASS_STREAK - s}回">${"●".repeat(s)}${"○".repeat(PASS_STREAK - s)}</span></li>`;
          }).join("")}
          ${marked.length > 60 ? `<li class="muted small">ほか ${marked.length - 60}語</li>` : ""}
        </ul>`
      : `<p class="muted small" style="margin:0">まだありません。テストでまちがえた単語がここにたまります。</p>`}

      <h2 class="section-title">単語帳</h2>
      <a class="btn ghost wide" id="book" href="${esc(bookUrl(list.id, s0, e0))}">この範囲の単語帳を開く</a>

      <p class="muted small" style="margin:28px 0 0">合格や×印の記録は、このスマホのブラウザに保存されます。iPhoneは「ホーム画面に追加」して使うと記録が消えにくくなります。<button class="linkish" id="reset">${esc(list.name)}の記録を消す</button></p>
    </article>`;

  const savePrefs = (patch) => store.set("vt3:prefs", { ...(store.get("vt3:prefs") || {}), ...patch });
  document.querySelectorAll('input[name="l"]').forEach((r) => r.addEventListener("change", () => { savePrefs({ l: r.value }); showHome(); }));
  const resumeBtn = document.getElementById("resume");
  if (resumeBtn) resumeBtn.addEventListener("click", () => { location.hash = "#quiz"; });

  const readRange = () => ({
    s: parseInt(document.getElementById("s").value, 10),
    e: parseInt(document.getElementById("e").value, 10),
    n: parseInt(document.getElementById("n").value, 10),
  });
  const bookLink = document.getElementById("book");
  const sIn = document.getElementById("s"), eIn = document.getElementById("e");
  // 範囲が変わったら: タイルの選択・この範囲の進み具合・単語帳のリンクを合わせる
  const syncRange = () => {
    const r = readRange();
    const ok = r.s >= 1 && r.e >= r.s;
    document.querySelectorAll(".blk").forEach((b) => b.setAttribute("aria-pressed", String(ok && +b.dataset.s === r.s && +b.dataset.e === r.e)));
    const box = document.getElementById("rangeStat");
    if (!ok) { box.innerHTML = ""; return; }
    bookLink.href = bookUrl(list.id, r.s, r.e);
    const c = countStates(list, prog, r.s, r.e);
    box.innerHTML = c.total
      ? `${stackBar(c)}<p>No.${r.s}〜${r.e}（${c.total}${U}）　合格 <b>${c.p}${U}・${pctOf(c.p, c.total)}%</b>${c.m ? `　×印 ${c.m}${U}` : ""}</p>`
        + `<p>${c.p === c.total ? "全部合格しているので、復習として出題します。" : c.p ? `まだ合格していない ${c.total - c.p}${U}から先に出題します。` : ""}</p>`
      : "";
  };
  document.querySelectorAll(".blk").forEach((b) => b.addEventListener("click", () => {
    sIn.value = b.dataset.s;
    if (list.block) document.getElementById("n").value = +b.dataset.e - +b.dataset.s + 1;
    eIn.value = b.dataset.e;
    syncRange();
  }));
  [sIn, eIn].forEach((el) => el.addEventListener("input", syncRange));
  syncRange();

  document.getElementById("start").addEventListener("click", () => {
    const r = readRange();
    const hint = document.getElementById("hint");
    if (!(r.s >= 1 && r.e >= r.s)) { hint.textContent = `範囲は ${list.minNo}〜${list.maxNo} の間で、開始 ≦ 終了 にしてください`; return; }
    if (!(r.n >= 1)) { hint.textContent = "問題数を入れてください"; return; }
    const target = list.W.filter((w) => w.no >= r.s && w.no <= r.e);
    if (!target.length) { hint.textContent = `この範囲に単語がありません（No.${list.minNo}〜${list.maxNo}）`; return; }
    const ranges = { ...((store.get("vt3:prefs") || {}).ranges || {}), [list.id]: { s: r.s, e: r.e, n: r.n } };
    savePrefs({ l: list.id, ranges });
    startQuiz(list, pickNos(list, r.s, r.e, r.n), "test", { s: r.s, e: r.e });
  });

  const reviewBtn = document.getElementById("review");
  if (reviewBtn) reviewBtn.addEventListener("click", () => startReview(list));

  document.getElementById("reset").addEventListener("click", () => {
    confirmBox(`${list.name}の合格と×印の記録をすべて消します。よろしいですか？`, "消す", () => { saveProgress(list.id, {}); showHome(); });
  });
}

// ================= 4択（1問ずつ） =================
function renderQuiz(quiz) {
  const list = findList(quiz.l);
  if (quiz.i >= quiz.queue.length) return finishQuiz(quiz);
  const isReview = quiz.mode === "review";
  const isChoice = list.kind === "choice";
  const no = quiz.queue[quiz.i];
  const w = list.byNo.get(no);
  if (!quiz.cur || quiz.cur.i !== quiz.i) {
    quiz.cur = { i: quiz.i, no, ...makeQuestion(list.W, w) };
    store.set(QUIZ_KEY, quiz);
  }
  const { choices, answer } = quiz.cur;
  const rec = loadProgress(list.id)[no] || { s: 0 };
  const streakNow = Math.min(rec.s, PASS_STREAK);
  const left = new Set(quiz.queue.slice(quiz.i)).size;
  const countText = isReview ? `のこり ${left}${list.unit}` : `${quiz.i + 1} / ${quiz.queue.length}`;
  const kai = list.block ? Math.floor((w.no - list.minNo) / list.block) + 1 : 0;
  const pct = isReview ? (quiz.passed.length / (quiz.passed.length + left)) * 100 : (quiz.i / quiz.queue.length) * 100;
  document.title = `${countText}　英単語テスト`;

  $app.innerHTML = `
    <section class="quiz" id="quiz">
      <div class="qbar">
        <button class="quit" id="quit">✕ やめる</button>
        <span class="count">${countText}</span>
        <span class="streak" title="合格まで">${rec.m || isReview ? `${"●".repeat(streakNow)}${"○".repeat(PASS_STREAK - streakNow)}` : ""}</span>
      </div>
      <div class="track"><div style="width:${pct}%"></div></div>
      <div class="qcard${isChoice ? " is-choice" : ""}" id="card">
        <div class="qno">${kai ? `第${kai}回　` : ""}No.${w.no}${rec.m ? '<span class="tag">×印</span>' : ""}</div>
        ${isChoice ? `
        <p class="inst">次の英文中の下線部に最も意味が近いものを、下の 1 〜 4 のうちから1つ選びなさい。</p>
        <p class="sent" lang="en">${esc(w.s).replace(/\[(.+?)\]/, "<u>$1</u>")}</p>
        <button class="say-btn" id="say">${SPEAKER_SVG}英文を聞く</button>` : `
        <button class="word" lang="en" id="word" aria-label="${esc(w.en)}（タップで発音）">${esc(w.en)}</button>
        <button class="say-btn" id="say">${SPEAKER_SVG}発音</button>`}
        <div class="judge" id="judge" aria-hidden="true"></div>
      </div>
      <div class="choices" id="choices" role="group" aria-label="意味を選ぶ">
        ${choices.map((c, j) => `<button class="choice${isChoice ? " en" : ""}" data-j="${j}"${isChoice ? ' lang="en"' : ""}><span class="n">${j + 1}</span><span class="t">${esc(c)}</span></button>`).join("")}
      </div>
      <div id="after"></div>
    </section>`;

  const say = () => speak(isChoice ? w.s.replace(/[\[\]]/g, "") : w.en);
  const wordBtn = document.getElementById("word");
  if (wordBtn) wordBtn.addEventListener("click", say);
  document.getElementById("say").addEventListener("click", say);
  document.getElementById("quit").addEventListener("click", () => {
    confirmBox("途中でやめますか？ここまでの記録は残ります。ホームの「続きから」で再開できます。", "やめる", () => { location.hash = ""; });
  });

  let answered = false;
  const buttons = [...document.querySelectorAll(".choice")];
  buttons.forEach((b) => b.addEventListener("click", () => choose(+b.dataset.j)));
  keyHandler = (ev) => {
    if (!answered && ["1", "2", "3", "4"].includes(ev.key)) { ev.preventDefault(); choose(+ev.key - 1); }
    else if (answered && (ev.key === "Enter" || ev.key === " ")) { const nx = document.getElementById("next"); if (nx) { ev.preventDefault(); nx.click(); } }
  };

  function choose(j) {
    if (answered) return;
    answered = true;
    document.getElementById("quiz").classList.add("answered");
    const ok = choices[j] === answer;
    const ansIdx = choices.indexOf(answer);
    const r = recordAnswer(list.id, no, ok);
    quiz.log.push({ no, ok });
    if (r.justPassed) quiz.passed.push(no);
    // 復習: 合格するまで、少しあとにもう一度出す
    if (isReview && !(r.streak >= PASS_STREAK)) {
      const gap = 2 + Math.floor(Math.random() * 3);
      quiz.queue.splice(Math.min(quiz.queue.length, quiz.i + 1 + gap), 0, no);
    }
    quiz.i += 1;
    quiz.cur = null;
    store.set(QUIZ_KEY, quiz);

    buttons.forEach((b, k) => {
      if (k === ansIdx) b.classList.add("correct");
      else if (k === j) b.classList.add("wrong");
      else b.classList.add("dim");
    });
    const judge = document.getElementById("judge");
    judge.className = `judge ${ok ? "ok" : "ng"}`;
    const after = document.getElementById("after");
    const next = () => renderQuiz(quiz);

    if (isChoice) {
      // 多義語: 正解でも不正解でも、この文での意味と訳を見せてから次へ進む
      if (ok && r.justPassed) document.getElementById("card").insertAdjacentHTML("beforeend", `<div class="pass-stamp" aria-label="合格">合格</div>`);
      const n = noteFor(list.id, w.en);
      const sub = !ok ? `×印を付けました。${isReview ? "このあともう一度出ます。" : ""}`
        : r.justPassed ? (isReview || rec.m ? "×印が消えました。" : "")
        : (isReview || rec.m) ? `あと${PASS_STREAK - r.streak}回続けて正解で合格` : "";
      after.innerHTML = `
        <div class="feedback ${ok && r.justPassed ? "pass" : ""}">
          <p class="head-line">${ok ? (r.justPassed ? `${PASS_STREAK}回続けて正解！ 合格です` : "正解！") : `正解は <span class="ans">${ansIdx + 1}　<span lang="en">${esc(answer)}</span></span>`}</p>
          ${sub ? `<span class="muted small">${sub}</span>` : ""}
          ${n ? `<p class="kaisetsu">${esc(n.note)}</p>${n.ex[0] ? `<p class="ex-ja">${esc(n.ex[0][1])}</p>` : ""}${n.exam ? `<p class="src">本番で出た語句：${esc(n.exam)}</p>` : ""}` : ""}
        </div>
        <div class="next-row"><button class="btn wide" id="next">次へ</button></div>`;
      document.getElementById("next").addEventListener("click", next);
    } else if (ok && r.justPassed) {
      document.getElementById("card").insertAdjacentHTML("beforeend", `<div class="pass-stamp" aria-label="合格">合格</div>`);
      after.innerHTML = `<div class="feedback pass"><p class="head-line">${PASS_STREAK}回続けて正解！ 合格です</p>${isReview || rec.m ? "×印が消えました。" : ""}</div>`;
      setTimeout(next, 1100);
    } else if (ok) {
      if (isReview || rec.m) after.innerHTML = `<div class="feedback"><p class="head-line">正解！ あと${PASS_STREAK - r.streak}回続けて正解で合格</p></div>`;
      setTimeout(next, isReview || rec.m ? 800 : 450);
    } else {
      const n = noteFor(list.id, w.en);
      const ex = n && n.ex[0];
      after.innerHTML = `
        <div class="feedback">
          <p class="head-line">正解は <span class="ans">${ansIdx + 1}　${esc(answer)}</span></p>
          <span class="muted small">×印を付けました。${isReview ? "このあともう一度出ます。" : ""}</span>
          ${ex ? `<p class="ex-en" lang="en">${highlight(ex[0], w.en)}</p><p class="ex-ja">${esc(ex[1])}</p>` : ""}
        </div>
        <div class="next-row"><button class="btn wide" id="next">次へ</button></div>`;
      document.getElementById("next").addEventListener("click", next);
    }
  }
}

function finishQuiz(quiz) {
  keyHandler = null;
  const list = findList(quiz.l);
  const isReview = quiz.mode === "review";
  const U = list.unit;
  if (!quiz.done) {
    quiz.done = true;
    quiz.ms = Date.now() - quiz.t0;
    store.set(QUIZ_KEY, quiz);
  }
  const total = quiz.log.length;
  const correct = quiz.log.filter((x) => x.ok).length;
  const wrongNos = [...new Set(quiz.log.filter((x) => !x.ok).map((x) => x.no))];
  const sec = Math.round((quiz.ms || 0) / 1000);
  const time = `${Math.floor(sec / 60)}分${sec % 60}秒`;
  const left = markedWords(list).length;
  const word = (no) => list.byNo.get(no);
  // 進み具合: はじめる前（quiz.base）→ いま
  const now = countStates(list, loadProgress(list.id), isReview ? list.minNo : quiz.s, isReview ? list.maxNo : quiz.e);
  const hasBase = typeof quiz.base === "number";
  const gain = hasBase ? now.p - quiz.base : 0;
  const pNow = pctOf(now.p, now.total);
  const pWas = hasBase ? pctOf(quiz.base, now.total) : pNow;
  document.title = isReview ? "復習の結果" : `${correct}/${total}　テストの結果`;

  $app.innerHTML = `
    <article class="sheet">
      <header class="head">
        <p class="kicker">${isReview ? "まちがえた問題の結果" : "テストの結果"}</p>
        <h1 class="title">${esc(list.name)}${isReview ? "" : `　No.${quiz.s}〜${quiz.e}`}</h1>
      </header>
      ${isReview
        ? `<p class="score-big"><strong>${quiz.passed.length}</strong><span>${U} 合格</span></p>
           <p class="score-meta">${total}回答えました・${time}</p>`
        : `<p class="score-big"><strong>${correct}</strong><span>/ ${total}</span></p>
           <p class="score-meta">正答率 ${total ? Math.round((correct / total) * 100) : 0}%・${time}</p>`}
      <div class="chips">
        ${quiz.passed.length ? `<span class="pass-chip">合格 ${quiz.passed.length}${U}</span>` : ""}
        ${!isReview && wrongNos.length ? `<span class="x-chip">×印 ${wrongNos.length}${U}</span>` : ""}
      </div>

      <div class="gain-box">
        <p class="gain-label">${isReview ? `${esc(list.name)} 全体` : `No.${quiz.s}〜${quiz.e}`}の進み具合（合格した${U === "問" ? "問題" : "単語"}）</p>
        ${stackBar(now, "big", gain)}
        <p class="gain-num">${pWas !== pNow ? `<span class="was">${pWas}%</span><span class="arrow">→</span>` : ""}<strong>${pNow}%</strong>${gain > 0 ? `<em>+${gain}${U} 合格</em>` : ""}</p>
        ${now.total && now.p === now.total
          ? `<p class="gain-sub all">この範囲は全部合格！</p>`
          : `<p class="gain-sub">${now.total}${U}のうち ${now.p}${U} 合格・のこり ${now.total - now.p}${U}</p>`}
      </div>

      ${!isReview && wrongNos.length ? `
        <h2 class="section-title">まちがえた単語（×印）</h2>
        <ul class="wordlist">${wrongNos.map((no) => `<li><span class="mk x">×</span><span class="en" lang="en">${esc(word(no).en)}</span><span class="ja">${esc(word(no).ja)}</span></li>`).join("")}</ul>` : ""}
      ${quiz.passed.length ? `
        <h2 class="section-title">合格した単語</h2>
        <ul class="wordlist">${quiz.passed.map((no) => `<li><span class="mk p">○</span><span class="en" lang="en">${esc(word(no).en)}</span><span class="ja">${esc(word(no).ja)}</span></li>`).join("")}</ul>` : ""}
      ${!isReview && !wrongNos.length ? `<p class="score-meta" style="margin-top:16px">全問正解！</p>` : ""}

      <div class="stack" style="margin-top:24px">
        ${left ? `<button class="btn wide red" id="review">まちがえた問題を解く（×印 ${left}${U}）</button>` : `<p class="score-meta">×印の単語はもうありません</p>`}
        ${isReview ? "" : `<button class="btn wide" id="again">同じ範囲でもう一度</button>`}
        ${wrongNos.length ? `<a class="btn ghost wide" href="${esc(bookUrl(list.id, isReview ? list.minNo : quiz.s, isReview ? list.maxNo : quiz.e, wrongNos))}">まちがえた単語を単語帳で確認</a>` : ""}
        <button class="btn ghost wide" id="home">ホームへ</button>
      </div>
    </article>`;
  window.scrollTo(0, 0);

  const reviewBtn = document.getElementById("review");
  if (reviewBtn) reviewBtn.addEventListener("click", () => startReview(list));
  const again = document.getElementById("again");
  if (again) again.addEventListener("click", () => {
    startQuiz(list, pickNos(list, quiz.s, quiz.e, quiz.queue.length), "test", { s: quiz.s, e: quiz.e });
  });
  document.getElementById("home").addEventListener("click", () => { location.hash = ""; });
}

function confirmBox(message, yesLabel, onYes) {
  const wrap = document.createElement("div");
  wrap.className = "modal";
  wrap.innerHTML = `<div class="modal-card" role="dialog" aria-modal="true"><p>${esc(message)}</p>
    <div class="row"><button class="btn ghost" data-a="no">もどる</button><button class="btn" data-a="yes">${esc(yesLabel)}</button></div></div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('[data-a="yes"]').focus();
  wrap.addEventListener("click", (ev) => {
    const a = ev.target.dataset && ev.target.dataset.a;
    if (ev.target === wrap || a === "no") wrap.remove();
    if (a === "yes") { wrap.remove(); onYes(); }
  });
}

// ================= 単語帳 =================
// NOTES_DATA: { 単語テストID: { 英語: [品詞, 例文1, 訳1, 例文2, 訳2, 解説, 出題] } }
const POS_JA = { noun: "名", verb: "動", adjective: "形", adverb: "副" };
const SPEAKER_SVG = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>`;

function noteFor(listId, en) {
  const n = NOTES_DATA[listId] && NOTES_DATA[listId][en];
  if (!n) return null;
  return { pos: n[0], ex: [[n[1], n[2]], [n[3], n[4]]].filter((e) => e[0]), note: n[5], exam: n[6] };
}
function readBookParams() {
  const p = new URLSearchParams(location.search);
  if (!p.has("b")) return null;
  const list = findList(p.get("b"));
  if (!list) return null;
  let s = parseInt(p.get("s"), 10), e = parseInt(p.get("e"), 10);
  if (!(s >= 1)) s = list.minNo;
  if (!(e >= s)) e = list.maxNo;
  const w = (p.get("w") || "").split(",").map((x) => parseInt(x, 10)).filter((x) => x >= 1);
  return { l: list.id, s, e, w };
}
function bookUrl(l, s, e, w) {
  const p = new URLSearchParams({ b: l, s, e });
  if (w && w.length) p.set("w", w.join(","));
  return `${location.href.split(/[?#]/)[0]}?${p.toString()}`;
}
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.9;
  speechSynthesis.speak(u);
}
// 例文の中の見出し語（活用形も含む）に印をつける
function highlight(sentence, en) {
  const safe = esc(sentence);
  const first = en.split(/[\s'’-]/)[0];
  const candidates = [en, first, first.length > 5 ? first.slice(0, -1) : "", first.length > 6 ? first.slice(0, -2) : ""];
  for (const c of candidates) {
    if (!c || c.length < 3) continue;
    const re = new RegExp(`\\b(${c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}[\\w'’-]*)`, "i");
    if (re.test(safe)) return safe.replace(re, "<mark>$1</mark>");
  }
  return safe;
}

function renderBook(cfg) {
  const list = findList(cfg.l);
  const all = list.W.filter((w) => w.no >= cfg.s && w.no <= cfg.e);
  const wrongSet = new Set(cfg.w);
  const ui = { q: "", hide: false, open: false, onlyWrong: wrongSet.size > 0 };
  const withNotes = all.filter((w) => noteFor(list.id, w.en)).length;
  document.title = `単語帳　${list.name} No.${cfg.s}〜${cfg.e}`;

  $app.innerHTML = `
    <article class="sheet">
      <header class="head">
        <a class="back" href="${esc(location.href.split(/[?#]/)[0])}">← ホームへ</a>
        <p class="kicker">単語帳</p>
        <h1 class="title" style="margin-right:0">${esc(list.name)}</h1>
        <p class="range" style="margin:0">No.${cfg.s}〜${cfg.e}　${all.length}語${withNotes ? `　例文・解説つき ${withNotes}語` : ""}</p>
        <div class="toolbar">
          <input class="search" id="q" type="search" placeholder="単語・意味で探す" autocomplete="off" aria-label="単語を探す">
          <button class="chip" id="hide" aria-pressed="false">意味をかくす</button>
          <button class="chip" id="open" aria-pressed="false">例文を全部開く</button>
          ${wrongSet.size ? `<button class="chip" id="wrong" aria-pressed="true">まちがえた単語だけ（${wrongSet.size}）</button>` : ""}
        </div>
        <p class="book-hint">単語やスピーカーをタップすると発音します。意味をかくしたときは、意味の部分をタップすると見えます。</p>
      </header>
      <ol class="book" id="book"></ol>
    </article>`;

  const $book = document.getElementById("book");

  function entryHtml(w) {
    const n = noteFor(list.id, w.en);
    const pos = n ? n.pos : (POS_JA[w.pos] || "");
    const more = n
      ? `${n.ex.map(([en, ja]) => `
          <div class="ex">
            <p class="ex-en" lang="en"><button class="speak small" data-say="${esc(en)}" aria-label="例文を読み上げる">${SPEAKER_SVG}</button><span>${highlight(en, w.en)}</span></p>
            <p class="ex-ja">${esc(ja)}</p>
          </div>`).join("")}
         <p class="note">${esc(n.note)}</p>
         ${n.exam ? `<p class="exam">${esc(n.exam)}</p>` : ""}`
      : `<p class="note muted">この単語の例文・解説は準備中です。</p>`;
    return `
      <li class="entry" id="w${w.no}">
        <div class="e-head">
          <span class="e-no">${w.no}</span>
          <button class="e-word" lang="en" data-say="${esc(w.en)}">${esc(w.en)}</button>
          ${pos ? `<span class="e-pos">${esc(pos)}</span>` : ""}
          <button class="speak" data-say="${esc(w.en)}" aria-label="発音を聞く">${SPEAKER_SVG}</button>
        </div>
        <p class="e-ja"><span class="ja-text">${esc(w.ja)}</span></p>
        <details class="e-more" ${ui.open ? "open" : ""}><summary>例文・解説</summary>${more}</details>
      </li>`;
  }

  function draw() {
    const q = ui.q.trim().toLowerCase();
    const rows = all.filter((w) => (!ui.onlyWrong || wrongSet.has(w.no)) && (!q || w.en.toLowerCase().includes(q) || w.ja.includes(q)));
    $book.classList.toggle("hide-ja", ui.hide);
    $book.innerHTML = rows.length ? rows.map(entryHtml).join("") : `<li class="empty">該当する単語がありません</li>`;
  }

  $book.addEventListener("click", (ev) => {
    const say = ev.target.closest("[data-say]");
    if (say) { speak(say.dataset.say); return; }
    const ja = ev.target.closest(".e-ja");
    if (ja && ui.hide) ja.classList.toggle("shown");
  });
  document.getElementById("q").addEventListener("input", (ev) => { ui.q = ev.target.value; draw(); });
  const toggle = (id, key, after) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener("click", () => {
      ui[key] = !ui[key];
      el.setAttribute("aria-pressed", String(ui[key]));
      after ? after() : draw();
    });
  };
  toggle("hide", "hide", () => $book.classList.toggle("hide-ja", ui.hide) && null || $book.querySelectorAll(".e-ja.shown").forEach((el) => el.classList.remove("shown")));
  toggle("open", "open", () => {
    document.getElementById("open").textContent = ui.open ? "例文を全部閉じる" : "例文を全部開く";
    $book.querySelectorAll(".e-more").forEach((d) => { d.open = ui.open; });
  });
  toggle("wrong", "onlyWrong");
  draw();
}

// ---- 画面の切り替え ----
// ?b=... なら単語帳、#quiz ならテスト、それ以外はホーム
function route() {
  keyHandler = null;
  const book = readBookParams();
  if (book) return renderBook(book);
  if (location.hash === "#quiz") {
    const quiz = store.get(QUIZ_KEY);
    if (quiz && findList(quiz.l) && Array.isArray(quiz.queue)) return quiz.done ? finishQuiz(quiz) : renderQuiz(quiz);
  }
  showHome();
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
